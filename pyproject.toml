[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-parcel-uncertainty"
version = "1.0.0"
license = {file = "LICENSE"}
description = "Reproducible crop classification and boundary-aware parcel probability aggregation"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
